architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "projectcell.mixins.json"
    }
    runs {
        client {
            client()
            name "Forge Client"
            runDir "run/client"
            programArgs "--username", "Player1"
        }
        server {
            server()
            name "Forge Server"
            runDir "run/server"
        }
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : rootProject.properties.mod_name,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'MixinConfigs'            : 'projectcell.mixins.json'
        ])
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version       : minecraft_version,
        minecraft_version_range : '[1.20.1,1.21)',
        forge_version           : project.forge_version,
        forge_version_range     : '[47,48)',
        loader_version_range    : '[47,)',
        mod_id                  : 'projectcell',
        mod_name                : 'ProjectCell',
        mod_version             : project.version,
        mod_authors             : 'gmr',
        mod_license             : 'MIT',
        mod_description         : '''An AE2 storage cell addon that bridges ProjectE with Applied Energistics 2.
EMC Storage Cell exposes the player\'s ProjectE transmutation knowledge and EMC balance as an AE2 storage cell.
Offline-owner build: with Team ProjectE installed, cells keep working while their owner is offline.'''
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

dependencies {
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Exact jars from the target pack (see libs/README.md).
    modImplementation files("${rootDir}/libs/appliedenergistics2-forge-15.4.10.jar")
    modImplementation files("${rootDir}/libs/ProjectE-1.20.1-PE1.0.1.jar")
    // Optional at runtime: only referenced from TeamProjectEBridge, which is loaded when the mod is present.
    modCompileOnly files("${rootDir}/libs/teamprojecte-1.20.1-1.1.5.jar")

    modRuntimeOnly files("${rootDir}/libs/guideme-20.1.15.jar")
}
